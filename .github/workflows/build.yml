name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y liblzma-dev libssl-dev zlib1g-dev zstd zip unzip
      - name: Build core and CLI
        run: make -j4
      - name: Run tests
        run: ./tests/run.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sayosign-cli-linux
          path: build/sayosign

  ios:
    runs-on: ${{ vars.IOS_RUNNER || 'macos-15-intel' }}
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -v beta | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - name: Build the idevice bridge (Rust)
        run: |
          rustup target add aarch64-apple-ios
          cd rust/sayoidev
          IPHONEOS_DEPLOYMENT_TARGET=15.0 cargo build --release --target aarch64-apple-ios
          ls -la target/aarch64-apple-ios/release/libsayoidev.a
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project SayoSign.xcodeproj -scheme SayoSign -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tee xcodebuild.log | grep -E "error:|warning: unre|BUILD" || true
          # xcodebuild's status is swallowed above (to keep the log short); a failed build
          # still leaves a partial .app behind, so require the finished bundle.
          grep -q "BUILD SUCCEEDED" xcodebuild.log
          test -f DerivedData/Build/Products/Release-iphoneos/SayoSign.app/Info.plist
      - name: Show errors
        if: failure()
        run: grep -E "error" -A3 xcodebuild.log | head -200
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R DerivedData/Build/Products/Release-iphoneos/SayoSign.app Payload/
          ls Payload/SayoSign.app/Frameworks || true
          zip -qry SayoSign.ipa Payload
          ls -la SayoSign.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: SayoSign-unsigned
          path: SayoSign.ipa
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SayoSign.ipa
          generate_release_notes: true
