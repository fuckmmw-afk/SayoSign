name: SayoSign
options:
  bundleIdPrefix: dev.murk
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.3.0"
    CURRENT_PROJECT_VERSION: "5"
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    ENABLE_BITCODE: "NO"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  SayoSign:
    type: application
    platform: iOS
    sources:
      - path: app/Sources
      - path: app/Resources
      - path: core/src
        excludes:
          - "compile_flags.txt"
      - path: core/include
        buildPhase: none
    info:
      path: app/Info.plist
      properties:
        CFBundleDisplayName: SayoSign
        CFBundleName: SayoSign
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ru, zh-Hans]
        UILaunchScreen:
          UIColorName: AccentColor
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
        UIBackgroundModes: [audio]
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: SayoSign runs a tiny server on this iPhone to install signed apps and to pair with this iPhone in Developer Mode.
        NSBonjourServices: [_remotepairing-pairable-host._tcp, _remotepairing._tcp]
        LSApplicationQueriesSchemes: [itms-services, apple-magnifier, filza, santander]
        CFBundleURLTypes:
          - CFBundleURLName: dev.murk.sayosign
            CFBundleURLSchemes: [sayosign]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.apple.itunes.ipa
            UTTypeDescription: iOS App
            UTTypeConformsTo: [public.data, public.zip-archive]
            UTTypeTagSpecification:
              public.filename-extension: [ipa, tipa]
          - UTTypeIdentifier: org.debian.deb-archive
            UTTypeDescription: Debian Package
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [deb]
          - UTTypeIdentifier: com.apple.mobileprovision
            UTTypeDescription: Provisioning Profile
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [mobileprovision]
          - UTTypeIdentifier: com.rsa.pkcs-12
            UTTypeDescription: PKCS12 Certificate
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [p12, pfx]
        CFBundleDocumentTypes:
          - CFBundleTypeName: iOS App
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.apple.itunes.ipa]
          - CFBundleTypeName: Debian Package
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.debian.deb-archive]
          - CFBundleTypeName: Provisioning Profile
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.apple.mobileprovision]
          - CFBundleTypeName: PKCS12 Certificate
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.rsa.pkcs-12]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.murk.sayosign
        PRODUCT_NAME: SayoSign
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_OBJC_BRIDGING_HEADER: app/Sources/SayoSign-Bridging-Header.h
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/core/include", "$(SRCROOT)/core/src"]
        OTHER_LDFLAGS: ["-lz", "-lcompression", "-lsayoidev", "-framework", "Security"]
        LIBRARY_SEARCH_PATHS: ["$(SRCROOT)/rust/sayoidev/target/aarch64-apple-ios/release"]
        GCC_WARN_INHIBIT_ALL_WARNINGS: "YES"
        CLANG_ENABLE_MODULES: "YES"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
    dependencies:
      - target: CydiaSubstrate
        embed: true
        link: false
  CydiaSubstrate:
    type: framework
    platform: iOS
    deploymentTarget: "12.0"
    sources:
      - path: hook/SayoHook.c
    info:
      path: hook/Info.plist
      properties:
        CFBundleExecutable: CydiaSubstrate
        CFBundleIdentifier: dev.sayosign.hook
        CFBundleName: CydiaSubstrate
        CFBundlePackageType: FMWK
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        MinimumOSVersion: "12.0"
    settings:
      base:
        PRODUCT_NAME: CydiaSubstrate
        PRODUCT_BUNDLE_IDENTIFIER: dev.sayosign.hook
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        LD_DYLIB_INSTALL_NAME: "@rpath/CydiaSubstrate.framework/CydiaSubstrate"
        OTHER_LDFLAGS: ["-lobjc"]
        GCC_SYMBOLS_PRIVATE_EXTERN: "YES"
        DEFINES_MODULE: "NO"
        SKIP_INSTALL: "YES"
